<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le pipeline de rendu conçu : Astro compile un thème vers du HTML, au build ou à la requête, à partir de trois niveaux de thème empilables — canonique, skins JSON à chaud, thèmes complets exigeant un build — avec hydratation d'îlots limitée aux composants interactifs visibles. La commande cogenta build n'est pas encore câblée.">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="currentColor">Trois niveaux de thème, empilables</text>

  <rect x="20" y="40" width="230" height="70" fill="none" stroke="currentColor" stroke-width="1.5" rx="5"/>
  <text x="135" y="63" text-anchor="middle" font-family="sans-serif" font-size="12">Thème canonique</text>
  <text x="135" y="79" text-anchor="middle" font-family="sans-serif" font-size="10">vocabulaire complet, AA</text>
  <text x="135" y="94" text-anchor="middle" font-family="sans-serif" font-size="10">maintenu par le projet</text>

  <rect x="270" y="40" width="230" height="70" fill="none" stroke="currentColor" stroke-width="1.5" rx="5"/>
  <text x="385" y="63" text-anchor="middle" font-family="sans-serif" font-size="12">Skins</text>
  <text x="385" y="79" text-anchor="middle" font-family="sans-serif" font-size="10">tokens JSON — variables CSS</text>
  <text x="385" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold">changement à chaud, sans build</text>

  <rect x="520" y="40" width="230" height="70" fill="none" stroke="currentColor" stroke-width="1.5" rx="5"/>
  <text x="635" y="63" text-anchor="middle" font-family="sans-serif" font-size="12">Thèmes complets</text>
  <text x="635" y="79" text-anchor="middle" font-family="sans-serif" font-size="10">implémentent le contrat direct</text>
  <text x="635" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold">exigent un build</text>

  <line x1="135" y1="110" x2="450" y2="180" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow4)"/>
  <line x1="385" y1="110" x2="450" y2="180" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow4)"/>
  <line x1="635" y1="110" x2="450" y2="180" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow4)"/>

  <rect x="330" y="184" width="240" height="60" fill="none" stroke="currentColor" stroke-width="2" rx="5"/>
  <text x="450" y="208" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="currentColor">Astro compile</text>
  <text x="450" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="currentColor">au build, ou à la requête</text>
  <text x="450" y="238" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="currentColor">le JS du frontmatter ne part jamais au navigateur</text>

  <line x1="450" y1="244" x2="450" y2="270" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="330" y="274" width="240" height="52" fill="none" stroke="currentColor" stroke-width="1.5" rx="5"/>
  <text x="450" y="296" text-anchor="middle" font-family="sans-serif" font-size="12">HTML</text>
  <text x="450" y="312" text-anchor="middle" font-family="sans-serif" font-size="10">zéro JS par défaut (îlots)</text>

  <path d="M 570 300 C 640 300, 660 300, 660 290" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow4)"/>
  <rect x="590" y="240" width="220" height="46" fill="none" stroke="currentColor" stroke-width="1" rx="4"/>
  <text x="700" y="258" text-anchor="middle" font-family="sans-serif" font-size="10.5">composant interactif hydraté</text>
  <text x="700" y="272" text-anchor="middle" font-family="sans-serif" font-size="10.5">seulement si dans le viewport</text>

  <path d="M 330 300 C 260 300, 240 300, 240 290" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow4)"/>
  <rect x="70" y="240" width="220" height="60" fill="none" stroke="currentColor" stroke-width="1" rx="4"/>
  <text x="180" y="260" text-anchor="middle" font-family="sans-serif" font-size="10.5">génération de skin par IA</text>
  <text x="180" y="275" text-anchor="middle" font-family="sans-serif" font-size="9.5">remplit un schéma de tokens sous</text>
  <text x="180" y="288" text-anchor="middle" font-family="sans-serif" font-size="9.5">contraintes vérifiables — jamais de CSS libre</text>

  <rect x="70" y="350" width="760" height="70" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3" rx="6"/>
  <text x="450" y="374" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b45309" font-weight="bold">Conception documentée (docs/02-architecture.md § 6)</text>
  <text x="450" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">La commande « cogenta build » n'est pas encore câblée (L9 tâche 9, différée) —</text>
  <text x="450" y="408" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">aucun astro.config.mjs n'existe dans ce dépôt aujourd'hui.</text>
</svg>
