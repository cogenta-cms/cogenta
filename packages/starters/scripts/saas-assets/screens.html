<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--fg:#111113;--muted:#5c5c66;--dim:#8b8b95;--line:#e4e4e7;--soft:#f4f4f5;--accent:#0068d5;--accentSoft:#eef4fe;--green:#138a4f;--amber:#b36b00}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:'Geist',sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',monospace}
.muted{color:var(--muted)}
svg{flex:none}
/* settings-style screens: 1600 x 1000 */
.page{width:1600px;height:1000px;overflow:hidden;position:relative}
.page .pad{padding:0 64px}
.crumb{padding-top:44px;font-size:24px;color:var(--muted)}
.crumb span{margin:0 12px;color:var(--dim)}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-top:14px}
h1{margin:0;font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.sub{font-size:24px;color:var(--muted);margin-top:10px}
.btn{height:60px;padding:0 22px;border:1.5px solid var(--line);border-radius:12px;display:inline-flex;align-items:center;gap:10px;font-size:24px;font-weight:500;background:#fff;white-space:nowrap}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;gap:16px}
.rule{border-top:1.5px solid var(--line)}
.th{font-size:24px;color:var(--muted);display:grid;align-items:center;height:84px}
.row{display:grid;align-items:center;border-top:1.5px solid var(--line);font-size:26px}
.chip{background:var(--soft);border-radius:8px;padding:6px 14px;font-weight:500;display:inline-block;margin-left:6px}
.step{width:44px;height:44px;border:1.5px solid #c9c9d0;border-radius:10px;display:inline-grid;place-items:center;font-size:24px;font-weight:500}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:12px;background:var(--green)}
.dot.a{background:var(--amber)}
.toggle{width:60px;height:36px;border-radius:18px;background:var(--accent);position:relative;flex:none}
.toggle::after{content:'';position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--soft);display:inline-grid;place-items:center;font-size:15px;font-weight:600;color:var(--muted);margin-right:14px}
.hl{background:var(--accentSoft);box-shadow:inset 5px 0 0 var(--accent)}
.sm{font-size:24px;color:var(--muted)}
.b{font-weight:500}
/* the approvals queue: 1200 x 760 css px, drawn at 2x */
.app{width:1200px;height:760px;display:grid;grid-template-columns:177px 1fr 290px;overflow:hidden;font-size:13px}
.side{background:#fafafb;border-right:1px solid var(--line);padding:14px 8px;display:flex;flex-direction:column;position:relative}
.ws{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;line-height:1.2;padding:2px 6px 14px}
.ws i{width:22px;height:22px;border-radius:6px;background:#111113;color:#fff;font-style:normal;font-size:9px;display:grid;place-items:center;letter-spacing:.02em}
.srch{border:1px solid var(--line);border-radius:7px;height:28px;display:flex;align-items:center;gap:7px;padding:0 9px;color:var(--dim);margin:0 0 12px;background:#fff}
.nav div{display:flex;justify-content:space-between;align-items:center;height:30px;padding:0 9px;border-radius:7px;color:#2a2a2f}
.nav div.on{background:#fff;border:1px solid var(--line);font-weight:500}
.nav small{color:var(--muted);font-size:12px}
.nav .grp{height:auto;padding:14px 9px 6px;font-size:11px;color:var(--dim)}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px 6px 0;border-top:1px solid var(--line);font-weight:500}
.me small{margin-left:auto;color:var(--muted);font-weight:400}
.me .avatar{width:24px;height:24px;font-size:9px;margin:0;background:var(--accentSoft);color:var(--accent)}
.list{display:flex;flex-direction:column;min-width:0}
.lh{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0}
.lh h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.sbtn{height:28px;padding:0 11px;border:1px solid var(--line);border-radius:7px;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.sbtn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:24px;padding:18px 24px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.tabs div{padding-bottom:10px;display:flex;gap:8px;align-items:center}
.tabs .on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--fg);font-weight:500}
.tabs em{font-style:normal;background:var(--accentSoft);color:var(--accent);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
.lr{display:grid;grid-template-columns:22px 1fr 96px 96px;align-items:center;gap:0 6px;padding:0 24px 0 24px;height:56px;border-bottom:1px solid var(--line)}
.lr.hd{height:36px;color:var(--muted);font-size:12px}
.lr.sel{background:var(--accentSoft);box-shadow:inset 3px 0 0 var(--accent)}
.cb{width:13px;height:13px;border:1.5px solid #c4c4cc;border-radius:4px;background:#fff}
.cb.on{background:var(--accent);border-color:var(--accent)}
.lr .t{font-weight:500;font-size:13.5px}
.lr .m{color:var(--muted);font-size:12px;margin-top:2px}
.lr .m b{font-weight:400;color:var(--dim);margin-left:6px}
.amt{text-align:right;font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.due{font-size:13px;color:var(--muted);padding-left:12px;white-space:nowrap}
.due.r::before,.due.o::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:#d92d20}
.due.o::before{background:var(--amber)}
.due.r,.due.o{color:var(--fg)}
.detail{border-left:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column}
.detail .top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.detail h3{margin:8px 0 10px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.detail .big{font-size:32px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.detail .kv{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12px}
.detail .kv span:first-child{color:var(--muted);white-space:nowrap}
.detail .kv span:last-child,.detail .kv a{text-align:right}
.detail .kv a{color:var(--accent)}
.detail h4{margin:20px 0 10px;font-size:13px;font-weight:600;padding-top:16px;border-top:1px solid var(--line)}
.chain{position:relative;margin-left:2px}
.node{display:grid;grid-template-columns:22px 1fr auto;gap:0 8px;margin-bottom:12px;font-size:12.5px;position:relative}
.node .c{width:16px;height:16px;border-radius:50%;border:1.5px solid #c4c4cc;margin-top:2px;background:#fff;position:relative;z-index:1}
.node .c.ok{background:var(--accent);border-color:var(--accent)}
.node .c.now{border-color:var(--accent)}
.node .c.now::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.node b{font-weight:500}
.node small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.node:not(:last-child)::before{content:'';position:absolute;left:7.5px;top:18px;bottom:-12px;width:1.5px;background:#d4d4da}
.cmt{display:flex;gap:8px;font-size:12px;line-height:1.45}
.cmt .avatar{width:22px;height:22px;font-size:8px;margin:0;flex:none}
.cmt small{color:var(--dim);margin-left:4px}
.inp{margin-top:10px;border:1px solid var(--line);border-radius:7px;height:30px;display:flex;align-items:center;padding:0 10px;color:var(--dim);font-size:12px}
.acts{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:14px}
.acts .sbtn{justify-content:center;height:34px;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search)
const lang = q.get('lang') === 'fr' ? 'fr' : 'en'
const view = q.get('view') || 'app'
const fr = lang === 'fr'
const t = (en, f) => (fr ? f : en)
const NB = ' ', NS = ' '
function money(cents, cur) {
  const n = (cents / 100).toFixed(2)
  const [i, d] = n.split('.')
  if (fr) return i.replace(/\B(?=(\d{3})+(?!\d))/g, NB) + ',' + d + NS + '€'
  return (cur === 'EUR' ? '€' : '$') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + d
}
const m = (n, cur) => money(Math.round(n * 100), cur)
const mw = (n) => m(n).replace(/[.,]00(?=[^0-9]|$)/, '')
const ic = (d, s = 15, w = 1.8, c = 'currentColor') =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}">${d}</svg>`
const I = {
  search: ic('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', 14, 2),
  inbox: ic('<path d="M3 13h5l1 3h6l1-3h5M5 5h14l2 8v6H3v-6z"/>'),
  check: ic('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),
  doc: ic('<path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/>'),

  flow: ic('<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7v10M8 5h4a4 4 0 0 1 4 4v1"/>'),
  list: ic('<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>'),
  bars: ic('<path d="M5 20V10M12 20V4M19 20v-8"/>'),
  plug: ic('<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>'),
  users: ic('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3-6 6.5-6s6 2 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .6 3.3 2.4 3.5 6"/>'),
  gear: ic('<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/>'),
  filter: ic('<path d="M4 6h16M7 12h10M10 18h4"/>', 13, 2),
  plus: ic('<path d="M12 5v14M5 12h14"/>', 13, 2.2),
  chev: ic('<path d="m6 9 6 6 6-6"/>', 14, 2),
  chevL: ic('<path d="m6 9 6 6 6-6"/>', 22, 2, '#8b8b95'),
  dl: ic('<path d="M12 4v11m-5-4 5 5 5-5M5 20h14"/>', 26, 2),
  arrow: ic('<path d="M4 12h16m-6-6 6 6-6 6"/>', 26, 2, '#8b8b95'),
  plug26: ic('<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>', 22, 2, '#5c5c66'),
}
const av = (s) => `<span class="avatar">${s}</span>`

const root = document.getElementById('root')
const V = {}

V.app = () => {
  const co = t('Halvorsen Freight', 'Marenne Logistique')
  const ini = t('HF', 'ML')
  const rows = fr
    ? [
        ['Révision freins, six tracteurs', 'DA-2481', 'Marta Silva', 'Flotte · FR', 18420, 'r', 'Aujourd’hui'],
        ['Pneus Kestrel, facture d’août', 'FA-9310', 'Hugo Perrin', 'Flotte · FR', 7912.4, 'o', 'Aujourd’hui'],
        ['Rayonnages entrepôt, baie 4 Lyon', 'DA-2479', 'Léa Fournier', 'Sites · FR', 42300, 'o', 'Demain'],
        ['Contrat annuel contrôle des chariots', 'BC-1177', 'Samir Haddad', 'Sites · BE', 9600, '', 'jeu. 4 sept.'],
        ['Coursiers du quai, surcharge ligne 11', 'FA-9302', 'Inès Roche', 'Exploit. · FR', 1284.75, '', 'jeu. 4 sept.'],
        ['Renouvellement télématique, 140 véhicules', 'DA-2476', 'Théo Marchand', 'Flotte · FR', 26880, '', 'ven. 5 sept.'],
        ['Cartes carburant, juillet', 'FA-9297', 'Hugo Perrin', 'Flotte · BE', 61045.18, '', 'lun. 8 sept.'],
        ['Intérimaires, semaines 38 à 41', 'DA-2470', 'Marta Silva', 'Exploit. · FR', 33600, '', 'mar. 9 sept.'],
        ['Douchettes de palettes (12)', 'DA-2468', 'Léa Fournier', 'Sites · FR', 4188, '', 'mer. 10 sept.'],
        ['Cabinet Delorme, revue de bail', 'FA-9288', 'Inès Roche', 'Finance', 3750, '', 'ven. 12 sept.'],
      ]
    : [
        ['Brake service for six tractor units', 'PR-2481', 'Marta Silva', 'Fleet · UK', 18420, 'r', 'Today'],
        ['Kestrel Tyres, August invoice', 'INV-9310', 'Owen Price', 'Fleet · UK', 7912.4, 'o', 'Today'],
        ['Warehouse racking, Felixstowe bay 4', 'PR-2479', 'Lena Fischer', 'Sites · UK', 42300, 'o', 'Tomorrow'],
        ['Annual forklift inspection contract', 'PO-1177', 'Samir Haddad', 'Sites · NL', 9600, '', 'Thu 4 Sep', 'EUR'],
        ['Dockside Couriers, route 11 surcharge', 'INV-9302', 'Grace Okafor', 'Ops · UK', 1284.75, '', 'Thu 4 Sep'],
        ['Telematics renewal, 140 vehicles', 'PR-2476', 'Tom Whitaker', 'Fleet · UK', 26880, '', 'Fri 5 Sep'],
        ['Harbour Energy, fuel cards July', 'INV-9297', 'Owen Price', 'Fleet · NL', 61045.18, '', 'Mon 8 Sep', 'EUR'],
        ['Temporary drivers, peak weeks 38 to 41', 'PR-2470', 'Marta Silva', 'Ops · UK', 33600, '', 'Tue 9 Sep'],
        ['Replacement pallet scanners (12)', 'PR-2468', 'Lena Fischer', 'Sites · UK', 4188, '', 'Wed 10 Sep'],
        ['Northbank Legal, lease review', 'INV-9288', 'Grace Okafor', 'Finance', 3750, '', 'Fri 12 Sep'],
      ]
  const nav = [
    [I.inbox, t('Inbox', 'Réception'), 12, 0],
    [I.check, t('Approvals', 'Validations'), 8, 1],
    [I.doc, t('Requests', 'Demandes'), '', 0],
    [I.doc, t('Invoices', 'Factures'), 41, 0],
    [I.cart, t('Purchase orders', 'Bons de commande'), '', 0],
    [I.bld, t('Vendors', 'Fournisseurs'), '', 0],
  ]
  const nav2 = [
    [I.flow, t('Policies', 'Politiques')],
    [I.list, t('Audit log', 'Journal d’audit')],
    [I.bars, t('Reports', 'Rapports')],
    [I.plug, t('Integrations', 'Intégrations')],
    [I.users, t('Directory', 'Annuaire')],
    [I.gear, t('Settings', 'Paramètres')],

  const item = ([i, l, n, on]) =>
    `<div class="${on ? 'on' : ''}"><span style="display:flex;gap:9px;align-items:center">${i}${l}</span><small>${n}</small></div>`
  return `<div class="app">

      .join('')}</div>
    <div class="me"><span class="avatar">${t('AT', 'CA')}</span>${t('Adrian Tan', 'Camille Aubry')}</div>
  </div>
  <div class="list">
    <div class="lh"><h2>${t('Approvals', 'Validations')}</h2><div style="display:flex;gap:8px"><span class="sbtn">${I.filter}${t('Filter', 'Filtrer')}</span><span class="sbtn p">${I.plus}${t('New request', 'Nouvelle demande')}</span></div></div>
    <div class="tabs"><div class="on">${t('Waiting on me', 'À valider par moi')}<em>8</em></div><div>${t('Waiting on others', 'En attente des autres')}<em style="background:var(--soft);color:var(--muted)">23</em></div><div>${t('Approved', 'Validées')}</div><div>${t('Rejected', 'Refusées')}</div></div>
    <div class="lr hd"><span class="cb"></span><span>${t('Request', 'Demande')}</span><span style="text-align:right">${t('Amount', 'Montant')}</span><span style="padding-left:12px">${t('Due', 'Échéance')}</span></div>
    ${rows
      .map(
        (r, i) => `<div class="lr ${i === 0 ? 'sel' : ''}"><span class="cb ${i === 0 ? 'on' : ''}"></span>
      <div><div class="t">${r[0]}</div><div class="m"><span class="mono" style="font-size:11px">${r[1]}</span> &nbsp;${r[2]}<b>${r[3]}</b></div></div>
      <div class="amt">${m(r[4], r[7])}</div><div class="due ${r[5]}">${r[6]}</div></div>`,
      )
      .join('')}
  </div>
  <div class="detail">
    <div class="top"><span class="mono">${rows[0][1]}</span><span>${t('Step 2 of 3', 'Étape 2 sur 3')}</span></div>
    <h3>${rows[0][0]}</h3>
    <div class="big">${m(18420)}</div>
    <div class="muted" style="font-size:12px;margin-top:3px">${t('Excl. VAT · Fleet · UK · Budget 2026-FL-03', 'HT · Flotte · FR · Budget 2026-FL-03')}</div>
    <div class="kv" style="margin-top:16px"><span>${t('Vendor', 'Fournisseur')}</span><span>${t('Westway Commercial Vehicles', 'Garage Lavigne PL')}</span></div>
    <div class="kv"><span>${t('Quote', 'Devis')}</span><a>${t('WCV-Q-20418.pdf', 'GLPL-D-20418.pdf')}</a></div>
    <div class="kv"><span>${t('Remaining budget', 'Budget restant')}</span><span>${t(mw(61280) + ' of ' + mw(240000), mw(61280) + ' sur ' + mw(240000))}</span></div>

      <div class="node"><span class="c"></span><div><b>${t('CFO', 'Direction financière')}</b><small>${t('Required above ' + mw(15000), 'Au-delà de ' + mw(15000))}</small></div><span>Hannah Brooks</span></div>
    </div>

    <div class="acts"><span class="sbtn">${t('Reject', 'Refuser')}</span><span class="sbtn p">${t('Approve', 'Valider')}</span></div>
  </div>
</div>`
}

V.policy = () => `<div class="page"><div class="pad">
  <div class="crumb">${t('Policies', 'Politiques')}<span>/</span></div>
  <div class="head"><div><h1>${t('Purchase requests', 'Demandes d’achat')}</h1>
  <div class="sub">${t('Version 14, published 12 Aug by Marta Silva. 2 unpublished changes.', 'Version 14, publiée le 12 août par Marta Silva. 2 modifications non publiées.')}</div></div>
  <div class="btns"><span class="btn">${t('Test on past requests', 'Tester sur l’historique')}</span><span class="btn p">${t('Publish changes', 'Publier')}</span></div></div></div>
  <div class="rule" style="margin-top:40px"></div>
  <div class="pad"><div class="th" style="grid-template-columns:80px 440px 470px 300px 1fr"><span>${t('Step', 'Étape')}</span><span>${t('When', 'Si')}</span><span>${t('Approved by', 'Validé par')}</span><span>${t('Deadline', 'Délai')}</span><span style="text-align:right">${t('Last 90 days', 'Sur 90 jours')}</span></div></div>
  ${[
    ['1', t('Amount <span class="muted">is at least</span> <span class="chip">' + mw(1000) + '</span>', 'Montant <span class="muted">d’au moins</span> <span class="chip">' + mw(1000) + '</span>'), t('Budget owner of the cost centre', 'Responsable du centre de coûts'), '', t('2 business days', '2 jours ouvrés'), '', '3 204', 0],
