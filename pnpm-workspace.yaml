packages:
  - 'packages/*'
  - 'examples/*'

# One version per tool for the whole workspace. Each package still declares what
# it uses — an undeclared import is a lint error — but the range lives here only.
# pnpm resolves `catalog:` to the real range when publishing.
catalog:
  '@aws-sdk/client-s3': ^3.1111.0
  '@aws-sdk/lib-storage': ^3.1109.0
  '@aws-sdk/s3-request-presigner': ^3.1109.0
  '@radix-ui/react-dialog': ^1.1.23
  '@redis/client': ^6.2.1
  '@tailwindcss/vite': ^4.3.3
  astro: ^7.2.1
  'axe-core': ^4.13.0
  '@simplewebauthn/browser': ^13.3.0
  '@simplewebauthn/server': ^13.3.2
  '@testing-library/dom': ^10.4.1
  '@testing-library/react': ^16.3.2
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  bullmq: ^6.1.0
  'class-variance-authority': ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  graphql: ^17.0.2
  i18next: ^26.3.6
  jsdom: ^27.4.0
  mysql2: ^3.23.3
  postgres: ^3.4.9
  react: ^19.2.8
  react-dom: ^19.2.8
  react-i18next: ^17.0.11
  react-router: ^8.3.0
  sharp: ^0.35.3
  slate: ^0.126.2
  slate-dom: ^0.126.0
  slate-history: ^0.113.1
  slate-react: ^0.126.0
  tailwindcss: ^4.3.3
  'tailwind-merge': ^3.6.0
  typescript: ^7.0.2
  vite: ^8.2.1
  vitest: ^4.1.10
  wasm-vips: ^0.0.18
  zod: ^4.4.3

# Native dependencies are opt-in only (rule R10): each one must ship a WASM fallback
# or a build-time precomputation before it may run its install scripts.
onlyBuiltDependencies:
  - esbuild
  - lefthook
