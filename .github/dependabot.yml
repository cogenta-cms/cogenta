version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # One PR for the toolchain instead of ten. Runtime dependencies stay
      # individual: rule R9 means each one gets read, not rubber-stamped.
      dev-tooling:
        patterns:
          - '@biomejs/*'
          - '@changesets/*'
          - '@commitlint/*'
          - '@playwright/*'
          - 'turbo'
          - 'typescript'
          - 'vitest'
          - 'lefthook'
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node major it describes. `engines` says >=22.11,
      # so types from a later major would let code compile against APIs that do
      # not exist on the minimum runtime we claim to support. This bump comes
      # back with the Node minimum, not with Dependabot.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
