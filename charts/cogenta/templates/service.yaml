apiVersion: v1
kind: Service
metadata:
  name: {{ include "cogenta.fullname" . | quote }}
  labels:
    {{- include "cogenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cogenta.selectorLabels" . | nindent 4 }}
