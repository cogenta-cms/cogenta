{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cogenta.fullname" . | quote }}
  labels:
    {{- include "cogenta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cogenta.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "cogenta.name" . | quote }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - {port: 4000, protocol: TCP}
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    - {}
    {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cogenta.fullname" . }}-postgresql
  labels:
    {{- include "cogenta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cogenta.postgresqlSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cogenta.selectorLabels" . | nindent 14 }}
        {{- if .Values.backup.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "cogenta.name" . | quote }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: backup
        {{- end }}
      ports:
        - {port: 5432, protocol: TCP}
{{- end }}
{{- end }}
