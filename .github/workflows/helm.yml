name: Helm

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      app_version:
        description: Container release tag (empty uses Chart.appVersion)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install manifest verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3
          tools_dir="$(mktemp -d)"
          curl -fsSL --retry 3 https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz -o "$tools_dir/kubeconform.tar.gz"
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  $tools_dir/kubeconform.tar.gz" | sha256sum --check
          tar -xzf "$tools_dir/kubeconform.tar.gz" -C "$tools_dir" kubeconform
          echo "$tools_dir" >> "$GITHUB_PATH"
      - name: Lint and validate Kubernetes 1.34 manifests
        shell: bash
        run: |
          set -euo pipefail
          helm lint charts/cogenta --strict
          helm template ci charts/cogenta --kube-version 1.34.0 | kubeconform -strict -summary -kubernetes-version 1.34.0 -ignore-missing-schemas
          for values in charts/cogenta/ci/*.yaml; do
            helm lint charts/cogenta --strict -f "$values"
            helm template ci charts/cogenta --kube-version 1.34.0 -f "$values" | kubeconform -strict -summary -kubernetes-version 1.34.0 -ignore-missing-schemas
          done
      - name: Check chart behavior and container security
        run: |
          python charts/cogenta/ci/verify.py
          python charts/cogenta/ci/test-secret-retention.py

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Package and publish the chart
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          trap 'helm registry logout ghcr.io' EXIT
          package_dir="$(mktemp -d)"
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--app-version "${GITHUB_REF_NAME#v}")
          elif [[ -n "$APP_VERSION" ]]; then
            args+=(--app-version "$APP_VERSION")
          fi
          helm package charts/cogenta --destination "$package_dir" "${args[@]}"
          helm push "$package_dir"/cogenta-*.tgz "oci://ghcr.io/${REPOSITORY_OWNER,,}/charts"
