apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cogenta.fullname" . }}-test
  labels:
    {{- include "cogenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "cogenta.fullname" . | quote }}
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 180
  securityContext:
    {{- include "cogenta.podSecurityContext" 10001 | nindent 4 }}
  containers:
    - name: ready
      image: {{ .Values.test.image | quote }}
      imagePullPolicy: IfNotPresent
      command: [curl]
      args:
        - --fail
        - --silent
        - --show-error
        - --retry
        - "20"
        - --retry-all-errors
        - --retry-delay
        - "3"
        - --connect-timeout
        - "3"
        - --max-time
        - "5"
        - {{ printf "http://%s:%v/readyz" (include "cogenta.fullname" .) .Values.service.port | quote }}
      securityContext:
        {{- include "cogenta.containerSecurityContext" 10001 | nindent 8 }}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      volumeMounts:
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: tmp
      emptyDir: {sizeLimit: 16Mi}
