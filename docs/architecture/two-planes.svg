<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cogenta sépare le plan de diffusion, sans accès à la base ni aux secrets, du plan de contrôle, qui seul détient l'état et les secrets ; les deux ne communiquent que par l'API de contenu HTTP, à jeton restreint.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Diffusion plane -->
  <rect x="40" y="30" width="820" height="150" fill="none" stroke="currentColor" stroke-width="1.5" rx="6"/>
  <text x="60" y="58" font-family="sans-serif" font-size="14" font-weight="bold" fill="currentColor">PLAN DE DIFFUSION — ce que voit le visiteur</text>
  <text x="60" y="76" font-family="sans-serif" font-size="11.5" fill="currentColor">Thèmes Astro, processus isolé : aucun secret, aucune connexion base</text>

  <g font-family="sans-serif" font-size="12" fill="currentColor">
    <rect x="70" y="92" width="150" height="60" fill="none" stroke="currentColor" rx="4"/>
    <text x="145" y="126" text-anchor="middle">Statique</text>
    <rect x="255" y="92" width="150" height="60" fill="none" stroke="currentColor" rx="4"/>
    <text x="330" y="126" text-anchor="middle">Node SSR</text>
    <rect x="440" y="92" width="150" height="60" fill="none" stroke="currentColor" rx="4"/>
    <text x="515" y="126" text-anchor="middle">Edge</text>
    <rect x="640" y="92" width="200" height="60" fill="none" stroke="currentColor" rx="4"/>
    <text x="740" y="120" text-anchor="middle">Client HTTP</text>
    <text x="740" y="136" text-anchor="middle" font-size="10.5">jeton restreint, lecture seule</text>
  </g>

  <!-- Boundary -->
  <line x1="450" y1="180" x2="450" y2="230" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="210" font-family="sans-serif" font-size="11.5" fill="currentColor">API de contenu (HTTP)</text>
  <text x="465" y="224" font-family="sans-serif" font-size="10" fill="currentColor">seule voie entre les deux plans</text>

  <!-- Control plane -->
  <rect x="40" y="230" width="820" height="300" fill="none" stroke="currentColor" stroke-width="1.5" rx="6"/>
  <text x="60" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="currentColor">PLAN DE CONTRÔLE — détient l'état et les secrets</text>

  <g font-family="sans-serif" font-size="11.5" fill="currentColor">
    <rect x="70" y="274" width="180" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="160" y="299" text-anchor="middle">Admin (SPA React)</text>
    <rect x="270" y="274" width="180" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="360" y="299" text-anchor="middle">API REST / GraphQL</text>
    <rect x="470" y="274" width="180" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="560" y="299" text-anchor="middle">Serveur MCP</text>
    <rect x="670" y="274" width="170" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="755" y="299" text-anchor="middle">Runtime d'agents</text>
  </g>

  <g font-family="sans-serif" font-size="11.5" fill="currentColor">
    <rect x="70" y="332" width="180" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="160" y="357" text-anchor="middle">Moteur de contenu</text>
    <rect x="270" y="332" width="180" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="360" y="357" text-anchor="middle">Schéma &amp; migrations</text>
    <rect x="470" y="332" width="180" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="560" y="357" text-anchor="middle">Versions &amp; i18n</text>
    <rect x="670" y="332" width="170" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="755" y="352" text-anchor="middle">Outils</text>
    <text x="755" y="365" text-anchor="middle" font-size="10">&amp; permissions</text>
  </g>

  <g font-family="sans-serif" font-size="11.5" fill="currentColor">
    <rect x="70" y="390" width="180" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="160" y="415" text-anchor="middle">Médias</text>
    <rect x="270" y="390" width="180" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="360" y="415" text-anchor="middle">Recherche</text>
    <rect x="470" y="390" width="180" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="560" y="415" text-anchor="middle">SEO</text>
    <rect x="670" y="390" width="170" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="755" y="415" text-anchor="middle">Orchestrateur</text>
  </g>

  <rect x="70" y="450" width="770" height="56" fill="none" stroke="currentColor" stroke-dasharray="4 3" rx="4"/>
  <text x="455" y="472" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="currentColor">Drivers, chacun avec un repli sans service externe (R1)</text>
  <text x="455" y="490" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="currentColor">DB · cache · file de jobs · stockage · vecteur · LLM</text>

  <text x="450" y="545" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="currentColor">Le plan de diffusion ne lit jamais la base ni un secret directement — seulement ce jeton restreint.</text>
</svg>
