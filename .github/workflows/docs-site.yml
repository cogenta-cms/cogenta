name: Docs site

# Publishes docs-site/content, rendered by @cogenta/render's Markdown
# renderer, to GitHub Pages — the "site statique généré" half of L22 task 7.
# The other half, `/admin/documentation`, ships inside the normal
# @cogenta/admin build and needs no separate deploy step here.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/guide-plugin.md'
      - 'examples/theme-starter/**'
      - 'examples/plugin-starter/**'
      - 'packages/render/src/docs/**'
      - 'packages/export/src/**'
      - 'packages/core/package.json'
  workflow_dispatch:

concurrency:
  group: docs-site-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only what the generator actually imports, and what those import in turn
      # (the trailing `...`): `@cogenta/export` needs `@cogenta/schema` built,
      # which a plain filter never selected. Not a full `pnpm build`.
      - run: pnpm --filter "@cogenta/render..." --filter "@cogenta/export..." --filter "@cogenta/blocks..." build
      - run: pnpm docs:site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
