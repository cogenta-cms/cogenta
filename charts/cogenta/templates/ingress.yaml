{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cogenta.fullname" . | quote }}
  labels:
    {{- include "cogenta.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.ingress.annotations }}
  {{- if .Values.ingress.tls.clusterIssuer }}
  {{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.ingress.tls.clusterIssuer }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ default (printf "%s-tls" (include "cogenta.fullname" .)) .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cogenta.fullname" . | quote }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
