# Git hooks. Installed by `pnpm install` (the root `prepare` script).
# Bypass with --no-verify only when you can say why out loud.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{ts,tsx,mts,js,mjs,json,jsonc}'
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    - name: no-secrets
      run: node scripts/check-staged-secrets.mjs

commit-msg:
  jobs:
    - name: conventional-commits
      run: pnpm exec commitlint --edit {1}

    - name: signed-off-by
      run: node scripts/check-signoff.mjs {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
