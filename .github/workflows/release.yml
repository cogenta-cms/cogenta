name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the "Version Packages" PR and git tags
      pull-requests: write
      id-token: write # npm provenance via OIDC — no long-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) needs npm CLI 11.5.0+ to do the token
      # exchange at all — Node 22.23.2 (`.node-version`) still bundles npm
      # 10.9.8, which silently falls back to an unauthenticated publish
      # instead of failing loudly, and the registry answers that with a
      # confusing 404 rather than a 401/403. Upgrading only the CLI here
      # keeps the pinned Node runtime version untouched everywhere else.
      # An exact version, not `latest`: this job holds the OIDC identity that
      # publishes to npm, so what runs in it is pinned like every action here.
      - run: npm install -g npm@11.21.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Opens or updates a "Version Packages" PR while changesets are pending;
      # publishes to npm once that PR is merged.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          # The trailer is required by the commit-msg hook, which runs for this
          # automated commit too. Carrying the bot's own identity keeps "every
          # commit is signed off" true, rather than disabling the check for the
          # one commit nobody looks at.
          commit: |
            chore(repo): version packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: 'chore(repo): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
