<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le cycle d'exécution d'un agent : à chaque étape, cinq garde-fous sont vérifiés dans un ordre fixe avant tout appel réel au modèle, puis la réponse est dispatchée vers l'exécution d'outils ou vers une des huit raisons d'arrêt réelles.">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arrowStop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="20" y="24" font-family="sans-serif" font-size="12.5" fill="currentColor">Contexte assemblé une fois : constitution → contexte du site → identité d'agent → instruction de tâche</text>

  <!-- check chain -->
  <g font-family="sans-serif" font-size="11.5" fill="currentColor">
    <rect x="20" y="46" width="260" height="44" fill="none" stroke="currentColor" rx="4"/>
    <text x="150" y="72" text-anchor="middle">assertProviderAllowed</text>
    <line x1="150" y1="90" x2="150" y2="114" stroke="currentColor" marker-end="url(#arrow3)"/>

    <rect x="20" y="118" width="260" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="150" y="142" text-anchor="middle">signal déjà annulé ?</text>
    <line x1="150" y1="158" x2="150" y2="182" stroke="currentColor" marker-end="url(#arrow3)"/>

    <rect x="20" y="186" width="260" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="150" y="210" text-anchor="middle">killSwitch.isActive() ?</text>
    <line x1="150" y1="226" x2="150" y2="250" stroke="currentColor" marker-end="url(#arrow3)"/>

    <rect x="20" y="254" width="260" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="150" y="278" text-anchor="middle">max_duration atteint ?</text>
    <line x1="150" y1="294" x2="150" y2="318" stroke="currentColor" marker-end="url(#arrow3)"/>

    <rect x="20" y="322" width="260" height="40" fill="none" stroke="currentColor" rx="4"/>
    <text x="150" y="346" text-anchor="middle">budget.checkCall() ?</text>
    <line x1="150" y1="362" x2="150" y2="390" stroke="currentColor" marker-end="url(#arrow3)"/>
  </g>

  <!-- model call, accent -->
  <rect x="20" y="394" width="260" height="50" fill="none" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="150" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#d97706" font-weight="bold">Appel modèle réel</text>
  <text x="150" y="431" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#d97706">usage enregistré au budget</text>

  <line x1="150" y1="444" x2="150" y2="468" stroke="currentColor" marker-end="url(#arrow3)"/>

  <rect x="20" y="472" width="260" height="40" fill="none" stroke="currentColor" rx="4" font-family="sans-serif"/>
  <text x="150" y="496" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="currentColor">appel(s) d'outil demandé(s) ?</text>

  <!-- yes: run tools, loop back -->
  <path d="M 280 486 C 400 486, 400 600, 300 600" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <rect x="60" y="580" width="220" height="42" fill="none" stroke="currentColor" rx="4"/>
  <text x="170" y="598" text-anchor="middle" font-family="sans-serif" font-size="11">exécuter le ou les outils</text>
  <text x="170" y="613" text-anchor="middle" font-family="sans-serif" font-size="9.5">résultat réinjecté dans les messages</text>
  <text x="330" y="545" font-family="sans-serif" font-size="10.5" fill="currentColor">oui</text>

  <path d="M 60 601 C -30 601, -30 130, 20 130" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow3)"/>
  <text x="-25" y="360" font-family="sans-serif" font-size="10.5" fill="currentColor" transform="rotate(-90 -25 360)" text-anchor="middle">étape suivante (jusqu'à max_steps)</text>

  <!-- no: check repetition then end -->
  <line x1="150" y1="512" x2="150" y2="536" stroke="currentColor" marker-end="url(#arrow3)"/>
  <text x="165" y="528" font-family="sans-serif" font-size="10.5">non</text>
  <rect x="20" y="540" width="260" height="40" fill="none" stroke="currentColor" rx="4"/>
  <text x="150" y="564" text-anchor="middle" font-family="sans-serif" font-size="11">appel identique déjà vu ?</text>

  <!-- stop reason boxes -->
  <g font-family="sans-serif" font-size="11" fill="#b45309">
    <line x1="280" y1="68" x2="560" y2="68" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrowStop)"/>
    <rect x="565" y="46" width="160" height="34" fill="none" stroke="#b45309" rx="4"/>
    <text x="645" y="68" text-anchor="middle">exception levée</text>

    <line x1="280" y1="138" x2="560" y2="138" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrowStop)"/>
    <rect x="565" y="120" width="160" height="34" fill="none" stroke="#b45309" rx="4"/>
    <text x="645" y="142" text-anchor="middle">cancelled</text>

    <line x1="280" y1="206" x2="560" y2="206" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrowStop)"/>
    <rect x="565" y="188" width="160" height="34" fill="none" stroke="#b45309" rx="4"/>
    <text x="645" y="210" text-anchor="middle">killed</text>

    <line x1="280" y1="274" x2="560" y2="274" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrowStop)"/>
    <rect x="565" y="256" width="160" height="34" fill="none" stroke="#b45309" rx="4"/>
    <text x="645" y="278" text-anchor="middle">max_duration</text>

    <line x1="280" y1="342" x2="560" y2="342" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrowStop)"/>
    <rect x="565" y="324" width="160" height="34" fill="none" stroke="#b45309" rx="4"/>
    <text x="645" y="346" text-anchor="middle">budget_exceeded</text>

    <line x1="280" y1="560" x2="560" y2="560" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrowStop)"/>
    <rect x="565" y="542" width="160" height="34" fill="none" stroke="#b45309" rx="4"/>
    <text x="645" y="564" text-anchor="middle">repetition_detected</text>

    <line x1="150" y1="580" x2="150" y2="656" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrowStop)"/>
    <text x="165" y="620" fill="#b45309">non</text>
    <rect x="565" y="638" width="160" height="34" fill="none" stroke="#b45309" rx="4"/>
    <text x="645" y="660" text-anchor="middle">end_turn / max_tokens</text>
    <line x1="280" y1="655" x2="560" y2="655" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrowStop)"/>

    <rect x="565" y="678" width="160" height="20" fill="none" stroke="#b45309" rx="3"/>
    <text x="645" y="693" text-anchor="middle" font-size="10">max_steps (25 par défaut)</text>
  </g>

  <!-- animated token tracing one full step of the loop -->
  <circle r="5" fill="#d97706">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M 150,50 L150,122 L150,190 L150,258 L150,326 L150,394 L150,468 C 280,486 400,486 400,540 C 400,600 300,600 280,601 C 60,601 -30,601 -30,360 C -30,190 -30,130 150,130" />
  </circle>

  <text x="450" y="20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="currentColor">huit raisons d'arrêt réelles (RunStopReason) — jamais de boucle infinie</text>
</svg>
