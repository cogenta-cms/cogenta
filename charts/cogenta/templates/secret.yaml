{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cogenta.secretName" . | quote }}
  labels:
    {{- include "cogenta.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- include "cogenta.secretData" . | nindent 2 }}
{{- end }}
