{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cogenta.postgresqlSecretName" . | quote }}
  labels:
    {{- include "cogenta.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- include "cogenta.postgresqlSecretData" . | nindent 2 }}
{{- end }}
